spring.application.name=SistemaHidro

# Em produção, defina SPRING_PROFILES_ACTIVE (ex: prod) para que o segredo de dev não seja usado
# e JWT_SECRET passe a ser obrigatório (ver application-dev.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hidro_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.port=${SERVER_PORT:8081}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
