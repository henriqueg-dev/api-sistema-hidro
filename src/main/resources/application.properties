spring.application.name=SistemaHidro

# Em produção, defina SPRING_PROFILES_ACTIVE (ex: prod) para que as configurações de dev
# (segredo JWT e credenciais locais de banco) não sejam usadas — ver application-dev.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco catálogo (contas, assinaturas, índice de login) — obrigatório fora do ambiente local,
# os defaults ficam em application-dev.properties. Cada escritório tem seu PRÓPRIO banco
# (hidro_tenant_<contaId>), criado sob demanda por TenantProvisionamentoService na mesma
# instância Postgres — não configurado aqui, ver config/TenantJpaConfig.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}

rate-limit.login.tentativas=${RATE_LIMIT_LOGIN_TENTATIVAS:5}
rate-limit.login.janela-segundos=${RATE_LIMIT_LOGIN_JANELA:300}
rate-limit.geral.requisicoes=${RATE_LIMIT_GERAL_REQUISICOES:120}
rate-limit.geral.janela-segundos=${RATE_LIMIT_GERAL_JANELA:60}

# CORS (lista separada por vírgula das origens do frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Assistente de IA (Claude). A chave NUNCA vai para o frontend: defina a variável
# de ambiente ANTHROPIC_API_KEY. Sem ela a aplicação sobe normalmente e a tela do
# assistente avisa que falta configurar.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.modelo=${ANTHROPIC_MODELO:claude-sonnet-5}

# E-mail transacional (Resend API, sem SDK). RESEND_API_KEY vazio faz os envios falharem com erro
# claro em vez de a aplicação não subir. RESEND_FROM precisa ser um remetente verificado no Resend
# (o sandbox onboarding@resend.dev só entrega para o e-mail da própria conta Resend).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# URL do frontend, usada para montar o link do e-mail de convite.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AbacatePay (cobrança PIX da assinatura). O webhook precisa ser cadastrado manualmente no
# painel/API da AbacatePay apontando para POST /api/webhooks/abacatepay, com o mesmo secret.
abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}

# Código de verificação (recuperação de senha / convite de engenheiro): expiração e tentativas.
codigo-verificacao.recuperacao-senha.expiracao-minutos=${CODIGO_RECUPERACAO_EXPIRACAO_MINUTOS:15}
codigo-verificacao.convite.expiracao-minutos=${CODIGO_CONVITE_EXPIRACAO_MINUTOS:2880}
codigo-verificacao.max-tentativas=${CODIGO_MAX_TENTATIVAS:5}

# Auditoria (Hibernate Envers) e demais propriedades específicas de cada EntityManagerFactory
# ficam em config/CatalogoJpaConfig e config/TenantJpaConfig — não aqui, já que não há mais um
# único DataSource/JPA autoconfigurado pelo Spring Boot para essa propriedade valer globalmente.
