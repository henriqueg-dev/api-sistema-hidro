# Configuração exclusiva para o profile "dev" (execução local).
# NUNCA ativar o profile "dev" em produção: defina SPRING_PROFILES_ACTIVE=prod
# (ou qualquer valor diferente de "dev") e as variáveis reais nesse caso.
jwt.secret=dev-local-secret-nao-usar-em-producao-9f8a7b6c5d4e3f2a1b

# Banco de dados local (as variáveis de ambiente continuam tendo prioridade)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hidro_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Frontend local (Vite)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SQL no console apenas em desenvolvimento (em produção polui o log e expõe dados)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
